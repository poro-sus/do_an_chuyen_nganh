# Render Blueprint cho LIBRIVO: một Web Service Docker (Laravel + React cùng domain)
# và một PostgreSQL miễn phí do Render quản lý. Không cần tài khoản dịch vụ ngoài.
# Hướng dẫn chi tiết: docs/DEPLOY-RENDER.md
#
# Lưu ý: Postgres miễn phí của Render hết hạn sau 30 ngày kể từ lúc tạo (có thêm 14 ngày để
# nâng cấp trước khi bị xoá) và không có sao lưu.
services:
  - type: web
    name: librivo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: LIBRIVO
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true # chuỗi ngẫu nhiên 256-bit; entrypoint tự thêm tiền tố base64:
      - key: LOG_CHANNEL
        value: stderr # để xem log trong tab Logs của Render
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: MAIL_MAILER
        value: log # chưa cấu hình SMTP: link reset mật khẩu nằm trong log
      - key: SEED_ON_BOOT
        value: "true" # nạp dữ liệu demo khi CSDL còn trống
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: librivo-db
          property: connectionString

databases:
  - name: librivo-db
    plan: free
    databaseName: librivo
    user: librivo
